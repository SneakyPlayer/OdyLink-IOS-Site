<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle vocale OdyLink</title>
<style>
:root{color-scheme:light dark;--bg:#e6f3ff;--ink:#14213d;--card:#fff;--line:#b9d3ee;--accent:#c8102e;--on-accent:#fff;--glow:#ffc83d;--soft:#5b6b88}
@media(prefers-color-scheme:dark){:root{--bg:#101a33;--ink:#eaf1ff;--card:#18264a;--line:#2c3f6e;--accent:#ff5a6e;--on-accent:#101a33;--soft:#9db0d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1rem;margin:0 0 8px}
p{margin:0}.soft{color:var(--soft);font-size:.9rem}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
button.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.voices button{text-align:left}.voices button[aria-pressed=true]{border:2px solid var(--accent);font-weight:700}
.who{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--bg)}
.badge small{display:block;color:var(--soft);font-size:.75rem}
.badge.on{border-color:var(--glow);animation:ring 1s ease-out infinite}
@keyframes ring{from{box-shadow:0 0 0 0 var(--glow)}to{box-shadow:0 0 0 12px transparent}}
@media(prefers-reduced-motion:reduce){.badge.on{animation:none;background:var(--glow);color:#14213d}}
#log{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto;display:grid;gap:6px}
#log li{padding:6px 10px;border-radius:10px;background:var(--bg)}
#log b{margin-right:6px}
.err{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Salle vocale OdyLink</h1>
  <p class="soft" id="status">Connexion au relais…</p>

  <section id="join">
    <h2>Rejoindre la salle</h2>
    <p class="err" id="joinErr" role="alert"></p>
    <label for="pseudo">Ton pseudo en jeu</label>
    <select id="pseudo"></select>
    <input id="pseudoOther" placeholder="Tape ton pseudo" maxlength="24" hidden>
    <p class="soft" id="gameInfo" style="margin:6px 0 14px"></p>
    <label>Ta voix (une voix = une personne)</label>
    <div class="voices" id="voices"></div>
    <label for="lang" style="margin-top:14px">Langue (micro et lecture)</label>
    <select id="lang"><option value="fr-FR">Français</option><option value="en-US">English</option><option value="es-ES">Español</option></select>
    <button class="main" id="joinBtn" style="width:100%;margin-top:14px">Rejoindre</button>
  </section>

  <div id="room" hidden style="display:grid;gap:16px">
    <section>
      <h2>Dans la salle</h2>
      <div class="who" id="who"></div>
    </section>
    <section>
      <div class="row">
        <button id="mic" aria-pressed="false">Micro : coupé</button>
        <button id="mute" aria-pressed="false">Son : activé</button>
      </div>
      <p class="soft" id="micInfo" style="margin-top:8px"></p>
      <form id="form" class="row" style="margin-top:10px">
        <input id="text" placeholder="Écris un message" maxlength="200" autocomplete="off" style="flex:3">
        <button class="main" style="flex:1">Envoyer</button>
      </form>
    </section>
    <section><h2>Messages</h2><ul id="log"></ul></section>
    <div class="row">
      <button id="share">Copier le lien de la salle</button>
      <button id="leave">Quitter</button>
    </div>
  </div>
  <p class="soft">Les messages sont lus à voix haute par la voix de chacun. Quiconque a le lien de la salle peut y entrer : ne le partage qu’avec tes amis.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
// Chaque profil : hauteur (pitch), vitesse (rate) et décalage dans la liste des voix de l'appareil.
const PROFILES = [
  {n:'Robot grave',p:0.1,r:0.8,v:0},{n:'Petit lutin',p:2,r:1.4,v:1},{n:'Géant lent',p:0.3,r:0.6,v:2},
  {n:'Speedy',p:1.6,r:1.9,v:0},{n:'Narrateur',p:0.6,r:0.9,v:1},{n:'Souris',p:2,r:1.0,v:2},
  {n:'Grosse voix',p:0.2,r:1.1,v:1},{n:'Mamie',p:1.3,r:0.7,v:0},{n:'Alien',p:1.8,r:0.6,v:2},
  {n:'Pressé',p:1.0,r:1.9,v:1},{n:'Zen',p:0.8,r:0.7,v:2},{n:'Écureuil',p:2,r:1.8,v:0}
];
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
let room = location.hash.slice(1);
if (!/^[A-Za-z0-9_-]{10,}$/.test(room)) { room = rnd(12); location.hash = room; }
const base = 'odylink-voice/' + room;
const myId = rnd(6);
let game = [], who = {}, me = null, pick = -1, micOn = false, paused = false, muted = false, rec = null;
const lang = () => $('#lang').value;
const clean = s => String(s || '').replace(/[\u0000-\u001f]/g, '').trim();

if (typeof mqtt === 'undefined') { $('#status').textContent = 'Impossible de charger le relais (réseau ?). Recharge la page.'; throw new Error('mqtt'); }
const client = mqtt.connect(BROKER, { clientId: 'ody_' + myId, reconnectPeriod: 2000,
  will: { topic: base + '/who/' + myId, payload: '', retain: true, qos: 0 } });
client.on('connect', () => {
  $('#status').textContent = 'Connecté au relais';
  client.subscribe([base + '/players', base + '/who/+', base + '/chat']);
  if (me) publishWho();
});
client.on('close', () => { $('#status').textContent = 'Connexion au relais perdue, nouvel essai…'; });
client.on('message', (topic, buf) => {
  const s = buf.toString(), k = topic.slice(base.length + 1);
  if (k === 'players') {
    try { game = JSON.parse(s).map(clean).filter(Boolean).slice(0, 64); } catch (e) { game = []; }
    renderJoin();
  } else if (k.startsWith('who/')) {
    const id = k.slice(4);
    if (s) { try { who[id] = JSON.parse(s); } catch (e) {} } else delete who[id];
    renderJoin(); renderRoom(); checkConflict();
  } else if (k === 'chat') onChat(s);
});

const others = () => Object.entries(who).filter(([id]) => id !== myId).map(([, w]) => w);
const publishWho = () => client.publish(base + '/who/' + myId, JSON.stringify(me), { retain: true });

function renderJoin() {
  if (me) return;
  const taken = new Set(others().map(w => w.pseudo));
  const sel = $('#pseudo'), prev = sel.value;
  sel.replaceChildren();
  game.forEach(n => { const o = new Option(taken.has(n) ? n + ' (déjà pris)' : n, n); o.disabled = taken.has(n); sel.add(o); });
  sel.add(new Option('Autre pseudo…', '__other'));
  if ([...sel.options].some(o => o.value === prev && !o.disabled)) sel.value = prev;
  else sel.value = ([...sel.options].find(o => !o.disabled) || sel.options[0]).value;
  $('#pseudoOther').hidden = sel.value !== '__other';
  $('#gameInfo').textContent = game.length ? 'Joueurs actuellement en jeu : ' + game.join(', ') + '.'
    : 'Aucune liste de joueurs reçue du serveur : tape ton pseudo.';
  const tv = new Set(others().map(w => w.voice)), box = $('#voices');
  box.replaceChildren();
  PROFILES.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = p.n + (tv.has(i) ? ' (prise)' : ''); b.disabled = tv.has(i);
    b.setAttribute('aria-pressed', String(pick === i));
    b.onclick = () => { pick = i; renderJoin(); };
    box.append(b);
  });
  if (tv.has(pick)) pick = -1;
}
$('#pseudo').onchange = () => { $('#pseudoOther').hidden = $('#pseudo').value !== '__other'; };

$('#joinBtn').onclick = () => {
  const name = clean($('#pseudo').value === '__other' ? $('#pseudoOther').value : $('#pseudo').value).slice(0, 24);
  if (!name) return ($('#joinErr').textContent = 'Choisis ou tape ton pseudo.');
  if (pick < 0) return ($('#joinErr').textContent = 'Choisis une voix.');
  $('#joinErr').textContent = '';
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) {}   // débloque la lecture sur iPhone
  me = { pseudo: name, voice: pick, ts: Date.now() };
  publishWho();
  $('#join').hidden = true; $('#room').hidden = false;
  renderRoom(); setupMic();
};

// Si quelqu'un a pris la même voix ou le même pseudo juste avant, le plus ancien garde la place.
function checkConflict() {
  if (!me) return;
  for (const [id, w] of Object.entries(who)) {
    if (id === myId) continue;
    if ((w.voice === me.voice || w.pseudo === me.pseudo) && (w.ts < me.ts || (w.ts === me.ts && id < myId))) {
      return leave('Quelqu’un a pris cette voix ou ce pseudo juste avant toi. Choisis-en un autre.');
    }
  }
}
function leave(msg) {
  client.publish(base + '/who/' + myId, '', { retain: true });
  stopMic(); me = null; pick = -1;
  $('#room').hidden = true; $('#join').hidden = false;
  $('#joinErr').textContent = msg || ''; renderJoin();
}
$('#leave').onclick = () => leave('');
addEventListener('beforeunload', () => { if (me) client.publish(base + '/who/' + myId, '', { retain: true }); });

function renderRoom() {
  if (!me) return;
  const box = $('#who'); box.replaceChildren();
  Object.entries(who).forEach(([id, w]) => {
    const d = document.createElement('div'); d.className = 'badge'; d.dataset.id = id;
    d.textContent = w.pseudo + (id === myId ? ' (toi)' : '');
    const s = document.createElement('small'); s.textContent = (PROFILES[w.voice] || PROFILES[0]).n; d.append(s);
    box.append(d);
  });
}
const mark = (id, on) => document.querySelectorAll('.badge').forEach(b => { if (b.dataset.id === id) b.classList.toggle('on', on); });

function addLog(m) {
  const li = document.createElement('li'), b = document.createElement('b');
  b.textContent = m.pseudo + ' :'; li.append(b, document.createTextNode(m.text));
  const log = $('#log'); log.append(li);
  while (log.children.length > 80) log.firstChild.remove();
  log.scrollTop = log.scrollHeight;
}
function send(text) {
  text = clean(text).slice(0, 200);
  if (!text || !me) return;
  const m = { id: myId, pseudo: me.pseudo, voice: me.voice, lang: lang(), text, ts: Date.now() };
  client.publish(base + '/chat', JSON.stringify(m));
  addLog(m);
}
function onChat(s) {
  if (!me) return;
  let m; try { m = JSON.parse(s); } catch (e) { return; }
  if (!m || m.id === myId || typeof m.text !== 'string') return;
  m = { id: clean(m.id), pseudo: clean(m.pseudo).slice(0, 24), voice: Number(m.voice) | 0, lang: clean(m.lang) || 'fr-FR', text: clean(m.text).slice(0, 200) };
  if (!m.text) return;
  addLog(m);
  if (!muted) speak(m);
}
$('#form').onsubmit = e => { e.preventDefault(); send($('#text').value); $('#text').value = ''; };

// Lecture : chaque message est lu avec la voix de son auteur, sur l'appareil de celui qui écoute.
const queue = []; let busy = false;
function speak(m) { queue.push(m); if (queue.length > 6) queue.shift(); if (!busy) next(); }
function next() {
  const m = queue.shift();
  if (!m) { busy = false; paused = false; resumeMic(); return; }
  busy = true; paused = true; if (rec) try { rec.abort(); } catch (e) {}
  const p = PROFILES[m.voice] || PROFILES[0], u = new SpeechSynthesisUtterance(m.text);
  const vs = (speechSynthesis.getVoices() || []).filter(v => v.lang.toLowerCase().startsWith(m.lang.slice(0, 2).toLowerCase()));
  if (vs.length) u.voice = vs[p.v % vs.length];
  u.lang = m.lang; u.pitch = p.p; u.rate = p.r;
  u.onstart = () => mark(m.id, true);
  u.onend = u.onerror = () => { mark(m.id, false); next(); };
  speechSynthesis.speak(u);
}
$('#mute').onclick = () => {
  muted = !muted; if (muted) { queue.length = 0; speechSynthesis.cancel(); }
  $('#mute').textContent = 'Son : ' + (muted ? 'coupé' : 'activé'); $('#mute').setAttribute('aria-pressed', String(muted));
};

// Micro : le navigateur transcrit ce que tu dis, puis le texte part vers les autres.
function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('#mic').disabled = !SR;
  $('#micInfo').textContent = SR ? 'Active le micro : tes phrases seront envoyées en texte, lues avec ta voix. Un casque évite que le jeu soit transcrit.'
    : 'La reconnaissance vocale n’existe pas sur ce navigateur : utilise la zone de texte (Safari ou Chrome recommandés).';
}
function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || rec) return;
  rec = new SR(); rec.lang = lang(); rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) send(e.results[i][0].transcript); };
  rec.onend = () => { rec = null; if (micOn && !paused) setTimeout(startRec, 250); };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopMic(); $('#micInfo').textContent = 'Micro refusé : autorise-le dans les réglages du navigateur.'; } };
  try { rec.start(); } catch (e) { rec = null; }
}
function resumeMic() { if (micOn && !rec) startRec(); }
function stopMic() { micOn = false; if (rec) try { rec.abort(); } catch (e) {} rec = null; $('#mic').textContent = 'Micro : coupé'; $('#mic').setAttribute('aria-pressed', 'false'); }
$('#mic').onclick = () => {
  if (micOn) return stopMic();
  micOn = true; $('#mic').textContent = 'Micro : actif'; $('#mic').setAttribute('aria-pressed', 'true'); startRec();
};
$('#share').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $('#share').textContent = 'Lien copié'; }
  catch (e) { prompt('Copie ce lien :', location.href); }
};
renderJoin();
</script>
</body>
</html>
